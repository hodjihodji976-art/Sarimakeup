          #t{align-items:center;justify-content:center;background:linear-gradient(135deg,#3d0a2a,#8a1c4d,#d4af37,#8a1c4d);background-size:300% 300%;animation:bgm 9s ease infinite;overflow:hidden;color:#fff}
          #t:before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#fff8 0 1.5px,#0000 2px) 0 0/46px 46px,radial-gradient(circle,#ffe9a8aa 0 1px,#0000 2px) 23px 23px/46px 46px;animation:tw 3s ease-in-out infinite alternate}
          #t h1{font:700 clamp(40px,14vw,76px) Georgia,serif;margin:0;display:flex;position:relative}
          #t h1 span{display:inline-block;animation:fl 2.4s ease-in-out infinite;text-shadow:0 0 18px #ffd86b99,0 3px 0 #0006}
          .go{position:relative;margin-top:28px;padding:13px 38px;border-radius:30px;background:linear-gradient(#ffe08a,#d4af37);color:#4a2300;font-weight:700;font-size:17px;box-shadow:0 6px 20px #0006}
