          if(d==3)o+=`<rect x="119" y="306" width="62" height="14" fill="${GD}"/>`;
          if(d==7)o+=ar('M124 226Q150 276 176 226',GD,7,'2 5');
          if(sl&&d!=5)o+=ar('M136 222Q150 246 164 222',GD,2);
          const sh=s('shoe'),sc=g('shoe');
          [136,164].forEach(x=>{o+=sh==4?`<rect x="${x-10}" y="486" width="20" height="22" rx="6" fill="${sc}"/>`:`<ellipse cx="${x}" cy="502" rx="9" ry="5" fill="${sk}"/>`+(sh==1?`<ellipse cx="${x}" cy="502" rx="12" ry="5" fill="${sc}"/><rect x="${x-9}" y="505" width="3" height="9" fill="${sc}"/>`:sh==2?`<ellipse cx="${x}" cy="502" rx="13" ry="5" fill="${sc}"/>`:sh==3?`<path d="M${x-12} 502Q${x} 494 ${x+12} 502M${x-8} 506L${x+8} 506" fill="none" stroke="${sc}" stroke-width="2"/>`:'')});
          const nk=s('neck'),nc=g('neck');
          if(nk==1)o+=`<path d="M126 212Q150 252 174 212" fill="none" stroke="${nc}" stroke-width="2.4"/>`;
          if(nk==2)o+=[0,1,2,3,4,5,6,7,8].map(i=>{const q=i/8;return`<circle cx="${126+48*q}" cy="${212+20*(1-(2*q-1)**2)}" r="3.6" fill="#fff" stroke="#ccc"/>`}).join('');
          if(nk==3)o+=`<path d="M124 207Q150 222 176 207" fill="none" stroke="${nc}" stroke-width="5"/>`;
          if(nk==4)o+=`<path d="M126 212Q150 252 174 212" fill="none" stroke="${nc}" stroke-width="1.8"/><circle cx="150" cy="234" r="6" fill="#e0245e" stroke="${nc}" stroke-width="2"/>`;
          o+=`<circle cx="${150-rx}" cy="146" r="8" fill="${skd}"/><circle cx="${150+rx}" cy="146" r="8" fill="${skd}"/>`;
          o+=`<path d="M${150-rx} 138C${150-rx} ${140-ry} ${150+rx} ${140-ry} ${150+rx} 138C${150+rx} 175 165 ${140+ry} 150 ${140+ry}C135 ${140+ry} ${150-rx} 175 ${150-rx} 138Z" fill="url(#fg${u})"/>`;
          if(s('face')==1)o+=`<ellipse cx="150" cy="104" rx="18" ry="7" fill="#fff" opacity=".22"/><ellipse cx="126" cy="152" rx="10" ry="5" fill="#fff" opacity=".2"/><ellipse cx="174" cy="152" rx="10" ry="5" fill="#fff" opacity=".2"/>`;
          const cr=[10,14,18][s('cheek')];
          o+=`<circle cx="124" cy="160" r="${cr}" fill="url(#bl${u})"/><circle cx="176" cy="160" r="${cr}" fill="url(#bl${u})"/><path d="M150 146Q145 160 147 164Q150 166 153 164Q155 160 150 146" fill="${skd}" opacity=".25"/>`;
          const bw=[2.6,2.6,4.6,1.4][s('brow')],bs=s('brow');
          [150-es,150+es].forEach((x,i)=>{const dd=i?1:-1,es2=s('eye');
          o+=`<path d="${bs==0||bs==2?`M${x-11} 126L${x+11} 125`:`M${x-11} 128Q${x} ${bs==1?119:121} ${x+11} 127`}" fill="none" stroke="${bc}" stroke-width="${bw}" stroke-linecap="round"/>`;
          o+=`<ellipse cx="${x}" cy="${es2==1?133:135}" rx="${es2==1?14:12}" ry="${es2==1?8:6}" fill="${ec}" opacity="${es2==1?.75:.45}"/><ellipse cx="${x}" cy="143" rx="9.5" ry="5.2" fill="#fff"/><circle cx="${x}" cy="143" r="4.4" fill="#3b2316"/><circle cx="${x}" cy="143" r="2" fill="#000"/><circle cx="${x+1.5}" cy="141.5" r="1.1" fill="#fff"/><path d="M${x-10} 143Q${x} 135 ${x+10} 143" fill="none" stroke="#1b1210" stroke-width="2"/>`;
          if(es2==2)o+=`<path d="M${x+dd*9} 142L${x+dd*17} 136" stroke="#1b1210" stroke-width="2" stroke-linecap="round"/>`;
          if(es2==3)o+=`<circle cx="${x+dd*4}" cy="133" r="1.4" fill="#fff"/><circle cx="${x-dd*3}" cy="131" r="1" fill="#fff"/>`});
          const ls=s('lip');
          o+=`<path d="M137 177Q144 170 150 173Q156 170 163 177Q150 192 137 177Z" fill="${ls==1?`url(#lg${u})`:ls==0?mx(lp,sk,.3):lp}"/>`+(ls==2?`<ellipse cx="150" cy="180" rx="7" ry="2" fill="#fff" opacity=".45"/>`:'');
          const hs=s('hair');
          o+=`<path d="${hs==7?'M98 138C94 74 206 74 202 138C192 108 156 96 150 96C140 96 106 108 98 138Z':hs==9?'M98 142C92 62 208 62 202 142C190 108 152 126 150 106C150 126 110 108 98 142Z':'M98 142C92 64 208 64 202 142C196 116 176 96 150 94C124 96 104 116 98 142Z'}" fill="url(#hg${u})"/><ellipse cx="136" cy="84" rx="20" ry="5" fill="#fff" opacity=".15"/>`;
          const gl=s('glass'),gk=g('glass');
          if(gl){const G=(x,q)=>gl==1?`<circle cx="${x}" cy="143" r="15"/>`:gl==2?`<ellipse cx="${x}" cy="143" rx="16" ry="11" transform="rotate(${q*-12} ${x} 143)"/>`:gl==3?`<rect x="${x-15}" y="132" width="30" height="22" rx="3"/>`:`<path d="M${x-16} 132Q${x} 128 ${x+16} 132Q${x+12} 156 ${x} 156Q${x-14} 156 ${x-16} 132Z"/>`;
          o+=`<g fill="${gk}" fill-opacity=".14" stroke="${gk}" stroke-width="2.4">${G(150-es,-1)+G(150+es,1)}<path d="M${150-es+15} 141Q150 136 ${150+es-15} 141" fill="none"/></g>`}
          const ex=s('extra'),xc=g('extra');
          if(ex==1)o+=`<g transform="translate(204 342) rotate(-15)"><path d="M0 0L-32 -44Q0 -66 32 -44Z" fill="${xc}"/><path d="M0 0L-18 -56M0 0L0 -60M0 0L18 -56" stroke="${GD}" stroke-width="1.5"/></g>`;
          if(ex==2)o+=`<path d="M86 352Q96 328 106 352" fill="none" stroke="${xc}" stroke-width="3"/><rect x="78" y="352" width="36" height="26" rx="6" fill="${xc}"/><rect x="92" y="360" width="8" height="6" rx="2" fill="${GD}"/>`;
          if(ex==3)o+=`<path d="M114 96L124 78L137 92L150 70L163 92L176 78L186 96Z" fill="${GD}" stroke="#fff" stroke-width="1.5"/><circle cx="150" cy="76" r="3" fill="#e0245e"/>`;
          if(ex==4)o+=`<g transform="translate(184 98)">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-7" rx="4.5" ry="7" fill="${xc}" transform="rotate(${a})"/>`).join('')}<circle r="3" fill="${GD}"/></g>`;
          if(ex==5)o+=`<circle cx="${150-rx}" cy="160" r="4" fill="#fff" stroke="#bbb"/><circle cx="${150+rx}" cy="160" r="4" fill="#fff" stroke="#bbb"/>`;
          return o+'</g></svg>'}
          const mk=i=>{const v={};C.forEach(c=>v[c[0]]={s:0,c:0});v.face.c=CH[i].sk;v.hair={s:CH[i].hs,c:CH[i].hc};v.cheek.s=1;return v};
          let S,ch=0,bg=0,cat='face';
          const show=id=>document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id==id));
          function back(){if($('#r').classList.contains('on')){$('#r').classList.remove('on');return'ok'}const on=document.querySelector('.s.on').id;if(on=='g')show('c');else if(on=='c')show('t');else return'exit';return'ok'}
          function start(i){ch=i;S=mk(i);bg=0;cat='face';$('#nm').textContent=CH[i].n;show('g');bn();ui()}
          function bn(){$('#sg').className='b'+bg;$('#bn').textContent=BGN[bg]}
          function nb(){bg=(bg+1)%4;bn()}
          function pick(k,t,i){S[k][t]=i;ui()}
          function ui(){const c=C.find(x=>x[0]==cat),k=cat;
          $('#tb').innerHTML=C.map(x=>`<button class="${x[0]==cat?'a':''}" onclick="cat='${x[0]}';ui()">${x[2]}<br>${x[1]}</button>`).join('');
          $('#cl').innerHTML=c[4].map((h,i)=>`<i class="${S[k].c==i?'a':''}" style="background:${h}" onclick="pick('${k}','c',${i})"></i>`).join('');
          $('#sl').innerHTML=c[3].map((n,i)=>`<b class="${S[k].s==i?'a':''}" onclick="pick('${k}','s',${i})">${n}${BK.includes(k)&&(k=='dress'||i>0)?`<small>${BR[(i+k.length)%6]}</small>`:''}</b>`).join('');
          $('#sv').innerHTML=av(S,CH[ch],0,'g')}
          function judge(){const x=S,pl=k=>C.find(a=>a[0]==k)[4][x[k].c],h=CH[ch],d=x.dress.s;
          const fits=[[4,0,1],[5,3,0],[1,0,9],[4,0,1],[4,0,5],[5,1,6],[4,1,9],[5,6,8]][d];
          const n=['neck','wrist','glass','shoe','glove','extra'].filter(k=>x[k].s>0).length;
          const hl=hd(pl('dress'),pl('lip')),bf=[[5,6,3],[0,8,2,1],[7,1,3,0],[8,4,9,5]][bg];
          const f=[1-Math.min(1,(hd(pl('lip'),pl('cheek'))*.6+hd(pl('eye'),pl('lip'))*.4)/110),1-Math.min(1,Math.abs(x.face.c-h.sk)/4),(hl<45||(hl>150&&hl<200))?1:.62,fits.includes(x.hair.s)?1:.55,Math.min(1,Math.max(.2,1-Math.abs(n-3.5)/4.5)+(x.neck.s&&x.wrist.s&&x.neck.c==x.wrist.c?.12:0)),bf.includes(x.dress.c)?1:.6];
          const L=['Warna makeup','Tone kulit','Baju & warna','Gaya rambut','Aksesoris','Latar'],Wt=[.2,.12,.2,.12,.2,.16];
          const t=Math.max(10,Math.min(100,Math.round(10+90*f.reduce((a,b,i)=>a+b*Wt[i],0))));
          const tip=['Warna blush, bibir, dan mata kurang selaras. Coba nuansa yang senada.','Warna foundation kurang cocok dengan kulit aslinya. Pilih yang lebih dekat.','Warna baju kurang serasi dengan bibir dan blush. Coba warna lain.','Gaya rambut kurang pas dengan baju daerah ini. Coba sanggul atau kepang.','Aksesoris terlalu sedikit atau berlebihan. Idealnya 3-4 item dengan logam senada.','Baju kurang serasi dengan suasana latar. Coba ganti latar atau warna baju.'][f.indexOf(Math.min(...f))];
          const gr=t>=90?'Ratu Nusantara 👑':t>=75?'Cantik Memesona 💖':t>=55?'Manis Natural 🌸':'Perlu Dipoles Lagi ✨';
          $('#rc').innerHTML='<div>Juri SariAI sedang menilai…</div>';$('#r').classList.add('on');
          setTimeout(()=>{$('#rc').innerHTML=`<div>Nilai ${h.n}</div><div class="sc" id="sn">0</div><b>${gr}</b><div style="margin-top:10px">${f.map((q,i)=>`<div class="br"><span>${L[i]}</span><div><i data-w="${Math.round(q*100)}"></i></div></div>`).join('')}</div><p>${t>=90?'Sempurna! Semua unsur serasi dengan baik.':'Saran juri: '+tip}</p><button class="bt p" onclick="back()">Lanjut Dandan</button><button class="bt" onclick="back();show('c')">Karakter Baru</button>`;
          setTimeout(()=>document.querySelectorAll('.br i').forEach(e=>e.style.width=e.dataset.w+'%'),50);
          let c=0;const iv=setInterval(()=>{c=Math.min(t,c+Math.ceil(t/25));$('#sn').textContent=c;if(c>=t)clearInterval(iv)},35)},1400)}
          $('#tl').innerHTML='SariMakeup'.split('').map((ch,i)=>`<span style="color:${i<4?'#ffb3cf':'#ffe08a'};animation-delay:${i*.12}s">${ch}</span>`).join('');
          $('#gr').innerHTML=CH.map((c,i)=>`<button class="cd" onclick="start(${i})">${av(mk(i),c,'60 50 180 200','c'+i)}<b>${c.n}</b><small>${c.o}</small></button>`).join('');
          </script></body></html>
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SariMakeup.apk
          gh release create "sm-v${{ github.run_number }}" SariMakeup.apk \
            --title "SariMakeup (build ${{ github.run_number }})" \
            --notes "APK siap diinstall. Android 7+."
