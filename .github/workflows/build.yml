name: Build SariMakeup APK

# Simpan file ini sebagai .github/workflows/build.yml di repo GitHub.
# Setelah commit, build jalan otomatis. APK muncul di tab Releases.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SariMakeup"
          include(":app")
          EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.zuhud.sarimakeup"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.zuhud.sarimakeup"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="SariMakeup"
                  android:icon="@android:drawable/ic_menu_gallery"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/zuhud/sarimakeup/MainActivity.kt)
          cat > app/src/main/java/com/zuhud/sarimakeup/MainActivity.kt <<'EOF'
          package com.zuhud.sarimakeup

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.os.Bundle
          import android.view.View
          import android.webkit.WebView

          class MainActivity : Activity() {
              private lateinit var web: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.setBackgroundColor(0xFF3D0A2A.toInt())
                  setContentView(web)
                  web.loadUrl("file:///android_asset/index.html")
              }

              @Suppress("DEPRECATION")
              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  web.evaluateJavascript("back()") { r ->
                      if (r != null && r.contains("exit")) finish()
                  }
              }

              @Suppress("DEPRECATION")
              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  }
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/assets/index.html)
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="id"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
