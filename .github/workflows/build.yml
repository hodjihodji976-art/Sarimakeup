          const tor=sl?'M114 226Q150 213 186 226L180 322L120 322Z':'M116 256Q150 248 184 256L180 322L120 322Z',K2=`M120 320L${150-sw} 484Q150 496 ${150+sw} 484L180 320Z`;
          o+=`<path d="${tor}" fill="${dc}"/><path d="${tor}" fill="url(#sh${u})"/><path d="${K2}" fill="${dc}"/><path d="${K2}" fill="url(#pt${u})"/><path d="${K2}" fill="url(#sh${u})"/><rect x="120" y="318" width="60" height="7" fill="${GD}"/>`;
          o+=`<path d="M${150-sw} 484Q150 496 ${150+sw} 484" fill="none" stroke="${GD}" stroke-width="4"/>`;
          if(d==2)o+=ar('M118 230L184 306',GD,10);
