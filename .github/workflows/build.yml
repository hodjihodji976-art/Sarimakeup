          #cl i{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #fff8;box-shadow:0 0 0 1px var(--bd)}#cl i.a{box-shadow:0 0 0 3px var(--ac)}
          #sl b{flex:none;padding:7px 11px;border-radius:12px;border:1px solid var(--bd);font-weight:500;text-align:center}#sl b.a{background:var(--ac);color:#fff}#sl small{display:block;font-size:9px;opacity:.7}
          .b0{background:radial-gradient(circle at 20% 25%,#fff9 0 40px,#0000 41px),radial-gradient(circle at 80% 40%,#fff6 0 60px,#0000 61px),linear-gradient(160deg,#ffd6e7,#e6d4ff 60%,#fff0f6)}
          .b1{background:repeating-radial-gradient(circle at 0 0,#0000 0 13px,#d4af3755 14px 15px,#0000 16px 28px),linear-gradient(#8a0f22,#3d0710)}
          .b2{background:radial-gradient(circle at 50% 30%,#d4af3799,#0000 55%),radial-gradient(circle,#ffe9a8cc 0 1px,#0000 2px) 0 0/34px 34px,linear-gradient(#1a1206,#4a3510 60%,#8a6a1c)}
          .b3{background:radial-gradient(circle at 50% 62%,#fff2b0 0 34px,#0000 36px),linear-gradient(#3a2a6a,#d9487a 55%,#ffb347 78%,#1f6a8a 79%)}
          #r{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#r.on{display:flex}
          .rc{background:var(--pn);border-radius:20px;padding:18px;max-width:380px;width:100%;max-height:92%;overflow:auto;text-align:center}
